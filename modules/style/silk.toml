[package]
name = "css-style"
description = "CSS parsing, selectors and the cascade, from bytes to computed values"
repository = "https://github.com/silk-lang/lib-css"
version = "0.1.0"
kind = "library"
exports = [
  "tokens", "input", "element", "lexer", "syntax", "selectors", "selector_index", "ancestor_filter",
  "properties", "values", "value_cursor", "value_keywords", "dimensions",
  "colors", "text_values", "effect_values", "transform_values",
  "media_queries", "media_features", "container_queries", "supports", "declaration_values", "encoding",
  "cascade", "layers", "resolver", "adopted", "adopted_variables", "compile", "sheet", "sheet_fonts", "sheet_conditions", "sheet_binary", "variables", "registration", "computed", "computed_projection", "computed_queries", "key_index",
  "cssom_error", "cssom_serialization", "cssom_declaration", "cssom_descriptors",
  "cssom_stylesheet", "cssom_media", "cssom_document", "cssom_computed",
  "cssom_inline", "cssom_loading",
  "written", "generated_content", "counter_styles",
  "typed_om", "typed_om_map", "typed_om_computed", "typed_om_unparsed",
  "typed_om_numeric", "typed_om_numeric_types", "typed_om_numeric_units",
  "typed_om_numeric_parse", "typed_om_numeric_sum", "typed_om_numeric_serialization",
  "typed_om_transform", "typed_om_color",
  "cssom_geometry", "cssom_geometry_parse", "cssom_geometry_serialization",
  "cssom_view", "cssom_view_geometry", "cssom_view_window",
]

[dependencies]
css_properties = { path = "../properties", package = "css-properties" }
svg_geometry = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c0b6b26992a0abc9b9864ffb6af46e61b6af73b4", path = "modules/geometry", package = "graphics-geometry" }
