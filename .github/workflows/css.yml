name: CSS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: css-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Silk
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=''
          while IFS= read -r line; do
            case "$line" in
              silk-version\ =\ *) version=${line#*\"}; version=${version%%\"*} ;;
            esac
          done < silk.toml
          test -n "$version"
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/silk-lang/silk/v${version}/install.sh" \
            -o "$RUNNER_TEMP/install-silk.sh"
          SILK_RELEASE="v$version" sh "$RUNNER_TEMP/install-silk.sh"
          echo "$HOME/.silk/bin" >> "$GITHUB_PATH"
      - name: Select Linux Clang
        if: runner.os == 'Linux'
        run: echo "SILK_CLANG=$(command -v clang-22)" >> "$GITHUB_ENV"
      - name: Select macOS Clang and SDK
        if: runner.os == 'macOS'
        run: |
          brew list llvm >/dev/null 2>&1 || brew install llvm
          echo "SILK_CLANG=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - run: silk use
      - run: silk check --workspace
      - run: silk test --manifest-path css/layout/silk.toml --root src/tests.silk
      - run: silk test --manifest-path css/style/silk.toml --root src/tests.silk
      - run: silk build --package css-layout-test-harness
