name: CSS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: css-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Silk
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SILK_RELEASE: v0.1.0-dev.72+9c780a04d6ef
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/silk-lang/silk/8214c402307b/install.sh" \
            -o "$RUNNER_TEMP/install-silk.sh"
          sh "$RUNNER_TEMP/install-silk.sh"
          echo "$HOME/.silk/bin" >> "$GITHUB_PATH"
      # Tasks are compiled programs: provision Clang 22 (and the macOS SDK) before any task.
      - name: Bootstrap Linux Clang
        if: runner.os == 'Linux'
        run: |
          test -x /usr/bin/clang-22 && test -x /usr/lib/llvm-22/bin/ld.lld || { sudo apt-get update && sudo apt-get install -y clang-22 lld-22; }
          echo "SILK_CLANG=/usr/bin/clang-22" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
      - name: Bootstrap macOS Clang and SDK
        if: runner.os == 'macOS'
        run: |
          test -x /opt/homebrew/opt/llvm@22/bin/clang || brew install llvm@22
          test -x /opt/homebrew/opt/lld@22/bin/ld64.lld || brew install lld@22
          echo "SILK_CLANG=/opt/homebrew/opt/llvm@22/bin/clang" >> "$GITHUB_ENV"
          echo "/opt/homebrew/opt/lld@22/bin" >> "$GITHUB_PATH"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - run: silk use
      - run: silk task ci
